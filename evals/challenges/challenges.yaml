# Agent Challenges
#
# 107 challenges across 21 skills (generic + Azure + 2 root skills)
# Each challenge tests whether the agent activates the correct skill
# and produces syntactically valid, non-hallucinated output.

challenges:

  # ─── GENERIC POSTGRESQL (20 challenges: 8 skills × ~2.5 each) ─────────────

  # advanced-indexing
  - id: gen-idx-01
    task: "My query on users table filters by email and sorts by created_at. It's doing a sequential scan on 10M rows. Help me add the right index."
    difficulty: medium
    target_skill: postgresql/advanced-indexing
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "CREATE INDEX"
      - "btree|B-tree"
    anti_patterns:
      - "ALTER SYSTEM"
      - "azure"

  - id: gen-idx-02
    task: "I need to search a JSONB column for documents containing a specific nested key. The table has 5M rows."
    difficulty: medium
    target_skill: postgresql/advanced-indexing
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "GIN|gin"
      - "jsonb_path_ops|jsonb_ops"

  - id: gen-idx-03
    task: "How do I set up DiskANN vector indexing on my PostgreSQL server?"
    difficulty: easy
    target_skill: postgresql/advanced-indexing
    platform_scope: generic
    expected_activation: false
    notes: "Should NOT activate advanced-indexing; this is azure-postgresql/vector-diskann territory"

  # query-performance
  - id: gen-perf-01
    task: "My SELECT query takes 30 seconds. Here's the query: SELECT * FROM orders JOIN customers ON orders.customer_id = customers.id WHERE orders.total > 1000 ORDER BY orders.created_at DESC LIMIT 100"
    difficulty: medium
    target_skill: postgresql/query-performance
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "EXPLAIN|explain"
      - "ANALYZE|analyze"

  - id: gen-perf-02
    task: "How do I read the output of EXPLAIN ANALYZE? I see 'loops=100' but I'm not sure what it means."
    difficulty: easy
    target_skill: postgresql/query-performance
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "loops"
      - "actual time"

  # jsonb-patterns
  - id: gen-json-01
    task: "I have a settings JSONB column. How do I query for users where settings.notifications.email is true?"
    difficulty: easy
    target_skill: postgresql/jsonb-patterns
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "->|->>"
      - "jsonb"

  - id: gen-json-02
    task: "What's the difference between -> and ->> operators in PostgreSQL?"
    difficulty: easy
    target_skill: postgresql/jsonb-patterns
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "->>"
      - "text|json"

  # table-partitioning
  - id: gen-part-01
    task: "My events table has 500M rows and queries always filter by event_date. Should I partition it?"
    difficulty: medium
    target_skill: postgresql/table-partitioning
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "PARTITION BY RANGE|partition by range"
      - "event_date|date"

  - id: gen-part-02
    task: "How do I detach a partition without locking the parent table?"
    difficulty: hard
    target_skill: postgresql/table-partitioning
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "DETACH.*CONCURRENTLY|detach.*concurrently"

  # row-level-security
  - id: gen-rls-01
    task: "I need each tenant in my multi-tenant app to only see their own data. How do I enforce this at the database level?"
    difficulty: medium
    target_skill: postgresql/row-level-security
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "CREATE POLICY|ROW LEVEL SECURITY"
      - "current_setting|session"

  - id: gen-rls-02
    task: "I enabled RLS but my admin user can still see all rows. Why?"
    difficulty: medium
    target_skill: postgresql/row-level-security
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "FORCE|force"
      - "table owner|BYPASSRLS"

  # full-text-search
  - id: gen-fts-01
    task: "I need to add search functionality to my blog. Users should be able to search posts by title and body with relevance ranking."
    difficulty: medium
    target_skill: postgresql/full-text-search
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "tsvector|to_tsvector"
      - "ts_rank|setweight"

  - id: gen-fts-02
    task: "How do I implement autocomplete/prefix search in PostgreSQL?"
    difficulty: medium
    target_skill: postgresql/full-text-search
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "tsquery|:*"

  # connection-management
  - id: gen-conn-01
    task: "My app is throwing 'too many connections' errors. I have 200 app servers each opening their own connection."
    difficulty: medium
    target_skill: postgresql/connection-management
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "pool|pgbouncer|connection limit"
      - "max_connections|pg_stat_activity"

  - id: gen-conn-02
    task: "How do I find and kill idle connections that have been open for more than 1 hour?"
    difficulty: easy
    target_skill: postgresql/connection-management
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "pg_stat_activity"
      - "pg_terminate_backend|idle"

  # logical-replication
  - id: gen-repl-01
    task: "I need to replicate specific tables from my production database to an analytics database in real-time."
    difficulty: hard
    target_skill: postgresql/logical-replication
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "PUBLICATION|CREATE PUBLICATION"
      - "SUBSCRIPTION|CREATE SUBSCRIPTION"

  - id: gen-repl-02
    task: "My replication slot is growing and WAL is filling up disk. What do I do?"
    difficulty: hard
    target_skill: postgresql/logical-replication
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "pg_replication_slots"
      - "active|drop"

  # Negative activation tests (should NOT trigger generic skills)
  - id: gen-neg-01
    task: "How do I deploy a PostgreSQL Flexible Server on Azure?"
    difficulty: easy
    target_skill: postgresql/query-performance
    platform_scope: generic
    expected_activation: false
    notes: "Azure provisioning, not generic performance"

  - id: gen-neg-02
    task: "Set up Entra ID authentication for my PostgreSQL database"
    difficulty: easy
    target_skill: postgresql/connection-management
    platform_scope: generic
    expected_activation: false
    notes: "Azure auth, not generic connection management"

  # ─── AZURE POSTGRESQL (30 challenges: 13 skills × ~2.3 each) ──────────────

  # extension-lifecycle
  - id: az-ext-01
    task: "I want to install the pgvector extension on my Azure PostgreSQL Flexible Server. How do I do it?"
    difficulty: easy
    target_skill: azure-postgresql/extension-lifecycle
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "azure.extensions|allowlist"
      - "CREATE EXTENSION vector"
    anti_patterns:
      - "superuser"
      - "ALTER SYSTEM"

  - id: az-ext-02
    task: "I'm getting 'permission denied to create extension' on Azure PostgreSQL. I'm using the admin user."
    difficulty: medium
    target_skill: azure-postgresql/extension-lifecycle
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "azure_pg_admin|allowlist"
      - "azure.extensions"

  # provisioning
  - id: az-prov-01
    task: "Create a Terraform configuration for a production Azure PostgreSQL Flexible Server with HA enabled."
    difficulty: hard
    target_skill: azure-postgresql/provisioning
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "azurerm_postgresql_flexible_server"
      - "high_availability|zone_redundant"

  # ha-disaster-recovery
  - id: az-ha-01
    task: "My Azure PostgreSQL server went down. I need to restore it to 2 hours ago using PITR."
    difficulty: hard
    target_skill: azure-postgresql/ha-disaster-recovery
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "point-in-time|restore"
      - "new server|connection string"
    anti_patterns:
      - "in-place restore"

  - id: az-ha-02
    task: "What's the difference between zone-redundant HA and same-zone HA in Azure PostgreSQL?"
    difficulty: medium
    target_skill: azure-postgresql/ha-disaster-recovery
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "zone-redundant|same-zone"
      - "failover|availability"

  # entra-id-auth
  - id: az-auth-01
    task: "I want my Azure Function to connect to PostgreSQL using managed identity instead of username/password."
    difficulty: hard
    target_skill: azure-postgresql/entra-id-auth
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "managed identity|Entra"
      - "token|az account get-access-token"

  - id: az-auth-02
    task: "My token-based connection to Azure PostgreSQL keeps expiring after 1 hour. How do I handle refresh?"
    difficulty: medium
    target_skill: azure-postgresql/entra-id-auth
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "token.*refresh|expire"
      - "1 hour|3600"

  # networking-ssl
  - id: az-net-01
    task: "I need to restrict access to my Azure PostgreSQL server so only my VNet can reach it."
    difficulty: medium
    target_skill: azure-postgresql/networking-ssl
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "private endpoint|VNet|vnet"
      - "firewall|network"

  # connection-pooling
  - id: az-pool-01
    task: "Should I use the built-in PgBouncer on Azure PostgreSQL or deploy my own? My app has 500 concurrent connections."
    difficulty: medium
    target_skill: azure-postgresql/connection-pooling
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "PgBouncer|pgbouncer"
      - "6432|built-in"

  # intelligent-tuning
  - id: az-tune-01
    task: "How do I see which indexes Azure PostgreSQL recommends for my workload?"
    difficulty: easy
    target_skill: azure-postgresql/intelligent-tuning
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "Query Store|query_store"
      - "recommend|index"

  # upgrades-maintenance
  - id: az-upg-01
    task: "I need to upgrade my Azure PostgreSQL server from version 14 to 16. What's the process?"
    difficulty: hard
    target_skill: azure-postgresql/upgrades-maintenance
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "major version upgrade|in-place"
      - "ANALYZE|vacuum"

  - id: az-upg-02
    task: "How do I set a custom maintenance window so upgrades don't happen during business hours?"
    difficulty: easy
    target_skill: azure-postgresql/upgrades-maintenance
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "maintenance window|schedule"

  # vector-diskann
  - id: az-vec-01
    task: "I have 10 million document embeddings. Should I use HNSW or DiskANN for my vector index on Azure PostgreSQL?"
    difficulty: medium
    target_skill: azure-postgresql/vector-diskann
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "DiskANN|diskann"
      - "10.*million|large|memory"

  - id: az-vec-02
    task: "How do I do filtered vector search — find similar documents but only within a specific category?"
    difficulty: medium
    target_skill: azure-postgresql/vector-diskann
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "WHERE|filter"
      - "<=>|vector"

  # genai-patterns (embeddings)
  - id: az-emb-01
    task: "I want to generate embeddings for my existing table data without leaving the database. I'm on Azure PostgreSQL."
    difficulty: medium
    target_skill: azure-postgresql/genai-patterns
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "azure_openai.create_embeddings|create_embeddings"
      - "UPDATE|embedding"

  - id: az-emb-02
    task: "I need to batch-embed 1 million rows. How do I avoid rate limits?"
    difficulty: hard
    target_skill: azure-postgresql/genai-patterns
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "batch|LIMIT"
      - "pg_sleep|rate"

  # genai-patterns (RAG)
  - id: az-rag-01
    task: "Build me a RAG system that combines vector similarity search with keyword search for my knowledge base on Azure PostgreSQL."
    difficulty: hard
    target_skill: azure-postgresql/genai-patterns
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "hybrid|RRF|reciprocal rank"
      - "tsvector|vector"

  - id: az-rag-02
    task: "My RAG system returns irrelevant results when users ask specific technical questions. How do I improve retrieval quality?"
    difficulty: hard
    target_skill: azure-postgresql/genai-patterns
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "hybrid|chunk|DiskANN|pre.?filter"
      - "embed.*query|azure_openai"

  # azure-ai (extension setup)
  - id: az-aiext-01
    task: "How do I connect my Azure PostgreSQL to Azure OpenAI so I can call AI functions from SQL?"
    difficulty: medium
    target_skill: azure-postgresql/azure-ai
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "azure_ai|set_setting"
      - "endpoint|openai"

  - id: az-aiext-02
    task: "I want to use managed identity instead of API keys for my azure_ai extension connection."
    difficulty: hard
    target_skill: azure-postgresql/azure-ai
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "managed_identity|managed identity"
      - "RBAC|role"

  # azure-ai (AI functions)
  - id: az-aifn-01
    task: "I want to classify support tickets as billing/technical/general using AI directly in a SQL query."
    difficulty: medium
    target_skill: azure-postgresql/azure-ai
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "azure_openai\\.create|azure_openai"
      - "classify|category|LIMIT"

  - id: az-aifn-02
    task: "How do I use PostgreSQL's EXTRACT function to get the year from a timestamp?"
    difficulty: easy
    target_skill: azure-postgresql/azure-ai
    platform_scope: azure-postgresql
    expected_activation: false
    notes: "PostgreSQL EXTRACT (date/time), NOT azure_ai.extract(). Should NOT activate azure-ai."

  # Cross-layer leakage tests
  - id: az-neg-01
    task: "How do I change max_connections on my Azure PostgreSQL server?"
    difficulty: medium
    target_skill: azure-postgresql/provisioning
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "az postgres flexible-server parameter"
    anti_patterns:
      - "ALTER SYSTEM"
      - "postgresql.conf"

  - id: az-neg-02
    task: "Grant superuser privileges to my application user on Azure PostgreSQL."
    difficulty: easy
    target_skill: azure-postgresql/extension-lifecycle
    platform_scope: azure-postgresql
    expected_activation: false
    anti_patterns:
      - "GRANT.*superuser|CREATE.*SUPERUSER"
    notes: "Superuser does not exist on Azure. Should warn user, not attempt."

  # Edge cases
  - id: edge-01
    task: "My pgvector extension is version 0.4.0 and I need to use HNSW indexes."
    difficulty: medium
    target_skill: azure-postgresql/vector-diskann
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "0.5|upgrade|version"
    notes: "HNSW requires pgvector >= 0.5.0. Skill should flag version requirement."

  - id: edge-02
    task: "I ran a PITR restore but my app still connects to the old server. What happened?"
    difficulty: medium
    target_skill: azure-postgresql/ha-disaster-recovery
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "new server|connection string"
      - "DNS|endpoint"

  - id: edge-03
    task: "I want to scale down my Azure PostgreSQL storage from 512GB to 256GB."
    difficulty: easy
    target_skill: azure-postgresql/provisioning
    platform_scope: azure-postgresql
    expected_activation: true
    expected_patterns:
      - "cannot.*scale.?down|not.*support.*scal|one.way|not supported|only.*increase|never.*decrease"
    notes: "Storage scale-down is not supported. Skill must warn."

  - id: edge-04
    task: "Help me set up vector search. My table is empty, no data yet."
    difficulty: easy
    target_skill: azure-postgresql/vector-diskann
    platform_scope: azure-postgresql
    expected_activation: true
    notes: "Edge case: empty table. Index creation works but ANALYZE won't help."

  # ─── ENRICHMENT CHALLENGES (generic skills - advanced content) ─────────────

  # advanced-indexing: REINDEX CONCURRENTLY, BRIN, covering indexes
  - id: enrich-idx-01
    task: "I need to rebuild a corrupted index on a 200GB table in production without locking writes. How?"
    difficulty: hard
    target_skill: postgresql/advanced-indexing
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "REINDEX.*CONCURRENTLY|reindex.*concurrently"
    anti_patterns:
      - "DROP INDEX.*CREATE INDEX"

  - id: enrich-idx-02
    task: "I have a time-series table with 500M rows inserted in order. Range queries on timestamp are slow even with B-tree. What index type is better?"
    difficulty: hard
    target_skill: postgresql/advanced-indexing
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "BRIN|brin"
      - "correlation|physical order"

  # query-performance: JIT, parallel query, pg_stat_statements
  - id: enrich-qp-01
    task: "My OLTP queries that return 1-5 rows are taking 50ms instead of 2ms. EXPLAIN shows JIT compilation time dominating. How do I fix this?"
    difficulty: hard
    target_skill: postgresql/query-performance
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "jit|JIT"
      - "jit_above_cost|SET.*jit.*off"

  - id: enrich-qp-02
    task: "I upgraded from PostgreSQL 11 to 16. Some CTEs that used to be fast are now slow because the planner inlines them. How do I control this?"
    difficulty: hard
    target_skill: postgresql/query-performance
    platform_scope: generic
    expected_activation: true
    expected_patterns:
      - "MATERIALIZED|materialized"
      - "CTE|WITH"

  # jsonb-patterns: jsonb_path_query, subscript syntax
  - id: enrich-json-01
    task: "I need to query a JSONB column using SQL/JSON path expressions to find items where price > 100 and category is 'electronics'. PostgreSQL 12+."
    difficulty: hard
    target_skill: postgresql/jsonb-patterns
    platform_scope: generic
    expected_activation: true
    expected_patterns:
