[pytest]
markers =
    integration: generic end-to-end MCP tests against a live PostgreSQL (Docker-backed; fails if no DB reachable)
    pg: validates SQL fences against a live PostgreSQL (Docker-backed; fails if no DB reachable)
    azure: dogfood tests requiring a real Azure Database for PostgreSQL via PGSQL_TEST_CONNECTION_STRING (fails if absent)
testpaths = tests
