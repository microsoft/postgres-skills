  - earthdistance
  - cube
  - pg_prewarm
  - pg_buffercache
  - postgres_fdw
  - dblink
  - amcheck
  - pageinspect
  - pg_visibility
  - bloom
  - rum
  - timescaledb
  - citus
  - pgrouting
  - plpgsql
