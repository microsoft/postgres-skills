challenges:
- anti_patterns:
  - ALTER SYSTEM
  - azure
  correctness_checks:
  - Does the response recommend a composite B-tree index on (email, created_at)?
  - Does the response explain why column order matters for filtering then sorting?
  - Is any CREATE INDEX example syntactically valid for PostgreSQL?
  difficulty: medium
  expected_activation: true
  expected_patterns:
  - CREATE INDEX
  - btree|B-tree
  id: gen-idx-01
  platform_scope: generic
  target_skill: skills/postgresql-best-practices/references/postgresql-advanced-indexing
  task: My query on users table filters by email and sorts by created_at. It's doing
    a sequential scan on 10M rows. Help me add the right index.
- correctness_checks:
  - Does the response recommend a GIN index for the JSONB column?
  - Does the response mention choosing jsonb_path_ops or jsonb_ops based on query
    operators?
  - Does the response include a valid PostgreSQL JSONB query or index example?
  difficulty: medium
  expected_activation: true
  expected_patterns:
  - GIN|gin
  - jsonb_path_ops|jsonb_ops
  id: gen-idx-02
  platform_scope: generic
  target_skill: skills/postgresql-best-practices/references/postgresql-advanced-indexing
  task: I need to search a JSONB column for documents containing a specific nested
    key. The table has 5M rows.
- correctness_checks:
  - Does the response recommend checking the plan with EXPLAIN ANALYZE before changing
    indexes?
  - Does the response discuss indexing the join, filter, or sort path rather than
    only giving generic tuning advice?
  - Does the response note that SELECT * can increase I/O and should be trimmed if
    possible?
  difficulty: medium
  expected_activation: true
  expected_patterns:
  - EXPLAIN|explain
  - ANALYZE|analyze
  id: gen-perf-01
  platform_scope: generic
  target_skill: skills/postgresql-best-practices/references/postgresql-query-performance
  task: 'My SELECT query takes 30 seconds. Here''s the query: SELECT * FROM orders
    JOIN customers ON orders.customer_id = customers.id WHERE orders.total > 1000
    ORDER BY orders.created_at DESC LIMIT 100'
- anti_patterns:
  - ->>'deleted_at' IS NULL
  difficulty: hard
  expected_activation: true
  expected_patterns:
  - \?
  - IS NULL|is null
  id: gen-new-01
  notes: 'Agent must distinguish missing key from null value. Common failure: suggesting
    ->> IS NULL which matches BOTH cases.'
  platform_scope: generic
  target_skill: skills/postgresql-best-practices/references/postgresql-jsonb-patterns
  task: I need to find all rows where the JSONB column 'metadata' has a key 'deleted_at'
    that is explicitly null, but NOT rows where the key is missing entirely. How do
    I write this WHERE clause?
- anti_patterns:
  - GRANT
  difficulty: medium
  expected_activation: true
  expected_patterns:
  - WITH CHECK
  id: gen-new-03
  platform_scope: generic
  target_skill: skills/postgresql-best-practices/references/postgresql-row-level-security
  task: I set up RLS with CREATE POLICY tenant_policy ON orders USING (tenant_id =
    current_setting('app.tenant')). Users can SELECT their data but INSERT is being
    denied. What am I missing?
- correctness_checks:
  - Does the response use phraseto_tsquery or the phrase operator rather than only
    plainto_tsquery?
  - Does the response explain that phrase search is different from unordered term
    matching?
  - Is the suggested SQL compatible with PostgreSQL FTS?
  difficulty: easy
  expected_activation: true
  expected_patterns:
  - phraseto_tsquery|<->
  - tsquery|phrase
  id: gen-fts-04
  platform_scope: generic
  target_skill: skills/postgresql-best-practices/references/postgresql-full-text-search
  task: I need exact phrase search for an issue tracker. Searching for "disk full"
    should match that phrase, not rows where disk and full are far apart.
- correctness_checks:
  - Does the response mention ranking normalization options or cover density ranking?
  - Does it explain that document length can otherwise dominate ranking unfairly?
  - Is the ranking guidance grounded in PostgreSQL FTS functions instead of generic
    search advice?
  difficulty: hard
  expected_activation: true
  expected_patterns:
  - ts_rank|ts_rank_cd
  - normalization|rank
  id: gen-fts-11
  platform_scope: generic
  target_skill: skills/postgresql-best-practices/references/postgresql-full-text-search
  task: Our legal search should prioritize shorter documents that match many terms,
    not giant PDFs that happen to contain the words once. How do I tune ranking normalization?
- correctness_checks:
  - Does the response explain that wrapping the column in a function can prevent a
    plain index from being used?
  - Does it suggest rewriting to a range predicate or using an expression index?
  - Is the tuning guidance specific to PostgreSQL planning behavior?
  difficulty: easy
  expected_activation: true
  expected_patterns:
  - expression index|rewrite
  - created_at >=|created_at <
  id: gen-perf-04
  platform_scope: generic
  target_skill: skills/postgresql-best-practices/references/postgresql-query-performance
  task: My query filters on DATE(created_at) = current_date and ignores the index
    on created_at. Why is that happening?
- correctness_checks:
  - Does the response compare LIST versus HASH partitioning for many tenants?
  - Does it mention skew and partition-count management as decision factors?
  - Does it avoid pretending one strategy is always correct?
  difficulty: medium
  expected_activation: true
  expected_patterns:
  - LIST|HASH
  - tenant_id|skew
  id: gen-part-06
  platform_scope: generic
  target_skill: skills/postgresql-best-practices/references/postgresql-table-partitioning
  task: I partitioned by tenant_id but now I need to decide between LIST and HASH
    partitioning for 600 tenants with uneven traffic. What's the tradeoff?
- correctness_checks:
  - Does the response address RLS behavior with partitioned tables explicitly?
  - Does it explain whether policy management is done at the parent and how partitions
    are affected?
  - Does it avoid treating partitions and inheritance as unrelated to RLS?
  difficulty: medium
  expected_activation: true
  expected_patterns:
  - partitioned table|partition
  - policy|parent
  id: gen-rls-09
  platform_scope: generic
  target_skill: skills/postgresql-best-practices/references/postgresql-row-level-security
  task: If I put RLS on a partitioned table, do the policies live on the parent only
    or do I need to duplicate them everywhere?
- correctness_checks:
  - Does the response mention testing with the effective role context or role inheritance
    in mind?
  - Does it explain that role membership can change which policies apply?
  - Does it keep the investigation grounded in PostgreSQL authorization behavior?
  difficulty: hard
  expected_activation: true
  expected_patterns:
  - role membership|SET ROLE
  - RLS|policy
  id: gen-rls-11
  platform_scope: generic
  target_skill: skills/postgresql-best-practices/references/postgresql-row-level-security
  task: Users belong to two tenant groups and now they can see more rows than expected
    through inherited role grants. How do I debug RLS with role membership in mind?
- correctness_checks:
  - Does the response treat logical slot failover as a nuanced, version-specific topic
    rather than guaranteed automation?
  - Does it warn the user to verify slot behavior during HA or failover design?
  - Does it avoid oversimplifying logical slots as magically portable in all setups?
  difficulty: hard
  expected_activation: true
  expected_patterns:
  - replication slot|logical
  - failover|slot
  id: gen-repl-11
  platform_scope: generic
  target_skill: skills/postgresql-best-practices/references/postgresql-replication
  task: We failed over a primary, and now the logical replication slot story is messy.
    Are failover-safe logical slots automatic?
- correctness_checks:
  - Does the response connect prepared-statement errors to transaction pooling and
    backend reuse?
  - Does it suggest connection-management remedies such as session mode or client-side
    prep?
  - Does it avoid dismissing the issue as only an ORM bug?
  difficulty: hard
  expected_activation: true
  expected_patterns:
  - prepared statement
  - PgBouncer|transaction mode
  id: gen-conn-10
  platform_scope: generic
  target_skill: skills/postgresql-best-practices/references/postgresql-connection-management
  task: My app uses PgBouncer transaction mode and sometimes gets prepared statement
    errors. Is that a database connection-management issue or just an ORM bug?
