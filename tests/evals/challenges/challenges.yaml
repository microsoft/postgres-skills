    - Does the response recognize that this is an environment setup question, not a references-skill activation?
    - Does it avoid forcing PostgreSQL reference-skill routing as the main answer?
    - Does it refrain from pretending skill activation is needed for a generic Docker task?
    notes: 'Negative case: generic Docker environment setup should not activate the root PostgreSQL references skill.'

  # ─── PG-GRAPH (pg-graph skill: ontology → build → query → explain) ────────

  - id: graph-ont-01
    task: "Point the agent at my normalized Postgres schema and propose a graph ontology I can review before finalizing."
    difficulty: medium
    target_skill: plugin/skills/pg-graph/references/ontology-derivation
    platform_scope: postgresql
    expected_activation: true
    expected_patterns:
      - "node|label|vertex"
      - "edge|relationship"
      - "confidence"
      - "feedback|approve|review"
    anti_patterns:
      - "ai\\.build_graph|ai\\.suggest_ontology"
      - "ALTER SYSTEM"
    correctness_checks:
      - "Does the response derive node labels from tables and edges from foreign keys?"
      - "Does it present the ontology as a proposal with confidence and a human feedback loop, not a finished artifact?"
      - "Does it avoid claiming an unreleased ai.* primitive builds the ontology?"

