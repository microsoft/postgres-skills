      - "LOAD 'age'"
    correctness_checks:
      - "Does the response use MERGE on a stable business key for idempotent loads instead of CREATE?"
      - "Does it deduplicate before writing and carry a provenance property like source_id?"
      - "Does it avoid unreleased ai.* primitives?"

