name: CI — Enterprise Test Suite

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REPO_ROOT: ${{ github.workspace }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # TESTS — no-DB default lane (pytest, runs without a database)
  # ═══════════════════════════════════════════════════════════════════════════════
  #
  # Covers content quality (manifests, structure, skill size, terminology, links,
  # activation precision, skill routing), security (secrets, licenses), MCP protocol
  # & skill routing, performance budget, binary integrity, and the
  # no-DB structural SQL fence lint. Database-backed lanes run in dedicated jobs:
  # `sql-validation` (marker: pg), `integration` (marker: integration), and
  # `azure-dogfood` (marker: azure, test_ai_app) which runs against a real Azure
  # server via PGSQL_TEST_CONNECTION_STRING.

  tests:
    name: "Tests: pytest suite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run pytest
        run: python -m pytest tests/ -v -m "not pg and not integration and not azure"
        timeout-minutes: 10
      - name: Routing eval gate (deterministic host adapters, no LLM)
        run: |
          cd tests/evals
          python routing_eval.py --check
        timeout-minutes: 5

  # ═══════════════════════════════════════════════════════════════════════════════
  # COMPATIBILITY
  # ═══════════════════════════════════════════════════════════════════════════════

  cli-integration:
    name: "Compat: ${{ matrix.cli }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cli: copilot-cli
            os: ubuntu-latest
            install_cmd: npm install -g @github/copilot@latest
            add_marketplace_cmd: copilot plugin marketplace add "$(pwd)"
            add_plugin_cmd: copilot plugin install postgres-skills@postgres-skills
            list_cmd: copilot plugin list

          - cli: claude-code
            os: ubuntu-latest
            install_cmd: npm install -g @anthropic-ai/claude-code@latest
            add_marketplace_cmd: claude plugin marketplace add "$(pwd)"
            add_plugin_cmd: claude plugin install postgres-skills@postgres-skills
            list_cmd: claude plugin list

          - cli: codex-cli
            os: ubuntu-latest
            install_cmd: npm install -g @openai/codex@latest
            add_marketplace_cmd: codex plugin marketplace add "$(pwd)"
            add_plugin_cmd: codex plugin add postgres-skills@postgres-skills
            list_cmd: codex plugin list

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ${{ matrix.cli }}
        run: ${{ matrix.install_cmd }}
        continue-on-error: false

      - name: Add marketplace (discover plugins)
        run: |
          set +e
          OUTPUT=$(${{ matrix.add_marketplace_cmd }} 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          if [ "$CODE" -ne 0 ]; then echo "✗ marketplace add exited $CODE"; exit 1; fi
          if echo "$OUTPUT" | grep -qi "error"; then echo "✗ marketplace add reported an error"; exit 1; fi
          echo "✓ marketplace added"

      - name: Install plugin
        run: |
          set +e
          OUTPUT=$(${{ matrix.add_plugin_cmd }} 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          if [ "$CODE" -ne 0 ]; then echo "✗ plugin install exited $CODE"; exit 1; fi
          if echo "$OUTPUT" | grep -qi "error"; then echo "✗ plugin install reported an error"; exit 1; fi
          echo "✓ plugin installed"

      - name: Verify plugin is installed
        run: |
          set +e
          OUTPUT=$(${{ matrix.list_cmd }} 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          if [ "$CODE" -ne 0 ]; then echo "✗ plugin list exited $CODE"; exit 1; fi
          # Assert postgres-skills appears as installed. Codex lists every
          # marketplace plugin (installed or not), so require a postgres-skills
          # line that is NOT "not installed"; Copilot/Claude only list installed
          # plugins, so their entry passes the same check.
          if ! echo "$OUTPUT" | grep -i "postgres-skills" | grep -qvi "not installed"; then
            echo "✗ postgres-skills not listed as installed"
            exit 1
          fi
          echo "✓ postgres-skills present and installed"

  cross-platform-binary:
    name: "Compat: Binary ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download and verify binary
        run: node plugin/run_mcp.js --version 2>&1 || true
        timeout-minutes: 3
      - name: Verify binary exists in cache
        shell: bash
        run: |
          CACHE_DIR="$HOME/.postgres-mcp"
          if [ -d "$CACHE_DIR" ]; then
            echo "✓ Binary cache created at $CACHE_DIR"
            find "$CACHE_DIR" -type f | sed -n '1,10p'
          else
            echo "✗ Binary cache not found"
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════════════════════
  # DATABASE
  # ═══════════════════════════════════════════════════════════════════════════════

  sql-validation:
    name: "DB: SQL syntax (PG ${{ matrix.pg_version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version: ["14", "15", "16", "17"]
    env:
      PG_VERSION: ${{ matrix.pg_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Start PostgreSQL (pgvector) via Docker
        run: docker compose -f tests/docker-compose.yml up -d --wait

      - name: Validate SQL snippets
        run: python -m pytest tests/test_sql_syntax.py -v -m pg

      - name: Stop database
        if: always()
        run: docker compose -f tests/docker-compose.yml down -v

  integration:
    name: "DB: Integration (MCP e2e)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Start PostgreSQL (pgvector) via Docker
        run: docker compose -f tests/docker-compose.yml up -d --wait
      - name: Run integration tests
        run: python -m pytest tests/ -v -m integration
        timeout-minutes: 15
      - name: Stop database
        if: always()
        run: docker compose -f tests/docker-compose.yml down -v

  # ═══════════════════════════════════════════════════════════════════════════════
  # AZURE
  # ═══════════════════════════════════════════════════════════════════════════════

  azure-dogfood:
    name: "Dogfood: AI app (Azure)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run Azure dogfood test
        env:
          PGSQL_TEST_CONNECTION_STRING: ${{ secrets.PGSQL_TEST_CONNECTION_STRING }}
        run: python -m pytest tests/test_ai_app.py -v -m azure
        timeout-minutes: 15
