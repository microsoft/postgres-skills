name: CI — Enterprise Test Suite

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_ROOT: ${{ github.workspace }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # CONTENT QUALITY
  # ═══════════════════════════════════════════════════════════════════════════════

  validate-manifests:
    name: "Content: Manifests & structure"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON manifests are parseable
        run: |
          echo "Checking marketplace manifests..."
          for f in .claude-plugin/marketplace.json tests/.skills.json; do
            echo "  ✓ $f"
            python3 -c "import json; json.load(open('$f'))"
          done

      - name: Validate single-plugin structure
        run: |
          echo "Checking root plugin structure..."
          for file in .mcp.json run_mcp.js tests/.skills.json README.md plugin/skills/postgresql-best-practices/SKILL.md; do
            if [ ! -f "$file" ]; then
              echo "  ✗ Missing required file: $file"
              exit 1
            fi
            echo "  ✓ $file exists"
          done
          ref_count=$(find plugin/skills/postgresql-best-practices/references -name "*.md" | wc -l)
          if [ "$ref_count" -lt 10 ]; then
            echo "  ✗ Expected at least 10 reference files, found $ref_count"
            exit 1
          fi
          echo "  ✓ $ref_count reference files found"
          python3 -c "import json; json.load(open('.mcp.json'))"
          python3 -c "import json; json.load(open('tests/.skills.json'))"

  skill-size-limits:
    name: "Content: Skill token budgets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/checks/check_skill_size.py

  terminology:
    name: "Content: Brand terminology"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/checks/check_terminology.py

  link-checker:
    name: "Content: Link validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/checks/check_links.py

  activation-precision:
    name: "Content: Activation keyword precision"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/checks/check_activation_precision.py

  routing-eval:
    name: "Content: Routing eval"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install routing eval dependency
        run: python -m pip install "pyyaml>=6.0"
      - name: Run routing eval
        run: python tests/evals/routing_eval.py --host all

  # ═══════════════════════════════════════════════════════════════════════════════
  # SECURITY
  # ═══════════════════════════════════════════════════════════════════════════════

  security:
    name: "Security: Secrets & content safety"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/checks/check_security.py

  license-compliance:
    name: "Security: License compliance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/checks/check_licenses.py

  dependency-audit:
    name: "Security: Dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check for known vulnerabilities
        run: |
          if [ -f package.json ]; then
            npm audit --production --audit-level=high || true
          fi
          echo "✓ Dependency audit complete"

  # ═══════════════════════════════════════════════════════════════════════════════
  # COMPATIBILITY
  # ═══════════════════════════════════════════════════════════════════════════════

  cli-integration:
    name: "Compat: ${{ matrix.cli }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cli: copilot-cli
            os: ubuntu-latest
            install_cmd: npm install -g @github/copilot@latest
            add_marketplace_cmd: copilot plugin marketplace list
            add_plugin_cmd: copilot mcp add postgresql-agent-skills -- node ./run_mcp.js
            verify_cmd: copilot mcp list

          - cli: claude-code
            os: ubuntu-latest
            install_cmd: npm install -g @anthropic-ai/claude-code@latest
            add_marketplace_cmd: claude plugin marketplace list
            add_plugin_cmd: claude mcp add postgresql-agent-skills -- node ./run_mcp.js
            verify_cmd: claude mcp list

          - cli: codex-cli
            os: ubuntu-latest
            install_cmd: npm install -g @openai/codex@latest
            add_marketplace_cmd: codex plugin marketplace add .
            add_plugin_cmd: codex mcp add postgresql-agent-skills -- node ./run_mcp.js
            verify_cmd: codex mcp list

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ${{ matrix.cli }}
        run: ${{ matrix.install_cmd }}
        continue-on-error: false

      - name: Add marketplace (discover plugins)
        run: ${{ matrix.add_marketplace_cmd }}

      - name: Add plugin directly
        run: ${{ matrix.add_plugin_cmd }}

      - name: Verify plugin is registered
        run: ${{ matrix.verify_cmd }}

      - name: Verify MCP server can start
        run: |
          timeout 30 node run_mcp.js < /dev/null 2>&1 | head -20 || true
          echo "✓ MCP runner executed without crash"

  mcp-conformance:
    name: "Compat: MCP protocol conformance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test MCP protocol
        run: node tests/checks/check_mcp_conformance.js
        timeout-minutes: 2

  cross-platform-binary:
    name: "Compat: Binary ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download and verify binary
        run: node run_mcp.js --version 2>&1 || true
        timeout-minutes: 3
      - name: Verify binary exists in cache
        shell: bash
        run: |
          CACHE_DIR="$HOME/.pgsql-tools"
          if [ -d "$CACHE_DIR" ]; then
            echo "✓ Binary cache created at $CACHE_DIR"
            find "$CACHE_DIR" -type f | sed -n '1,10p'
          else
            echo "✗ Binary cache not found"
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════════════════════
  # REGRESSION
  # ═══════════════════════════════════════════════════════════════════════════════

  sql-validation:
    name: "Regression: SQL syntax (PG ${{ matrix.pg_version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg_version }}
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install extensions (pgvector)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-${{ matrix.pg_version }}-pgvector || true

      - name: Validate SQL snippets
        env:
          PGSQL_TEST_CONNECTION_STRING: "host=localhost user=testuser password=testpass dbname=testdb"
          PG_VERSION: ${{ matrix.pg_version }}
        run: python3 tests/checks/check_sql_syntax.py

  dogfood-test:
    name: "Regression: Dogfood (90 checks)"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-dogfood')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run dogfood test
        env:
          PGSQL_TEST_CONNECTION_STRING: ${{ secrets.PGSQL_TEST_CONNECTION_STRING }}
        run: |
          if [ -z "$PGSQL_TEST_CONNECTION_STRING" ]; then
            echo "⚠ PGSQL_TEST_CONNECTION_STRING secret not set — skipping"
            exit 0
          fi
          node tests/test_ai_app.js

  eval-pipeline:
    name: "Regression: Eval delta tracking"
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install eval dependencies
        run: pip install -r tests/evals/requirements.txt
      - name: Run eval pipeline
        env:
          PGSQL_TEST_CONNECTION_STRING: ${{ secrets.PGSQL_TEST_CONNECTION_STRING }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: |
          if [ -z "$PGSQL_TEST_CONNECTION_STRING" ] || [ -z "$AZURE_OPENAI_ENDPOINT" ] || [ -z "$AZURE_OPENAI_API_KEY" ]; then
            echo "⚠ Required secrets not set — skipping eval pipeline"
            exit 0
          fi
          cd tests/evals
          python pipeline.py --provider azure --output results/
      - name: Upload eval summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: tests/evals/results/latest.json
          retention-days: 30
      - name: Upload detailed eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-detailed-results
          path: |
            tests/evals/results/report_*.json
            tests/evals/results/results_*.json
          retention-days: 30
      - name: Commit eval results on release tags only
        if: success() && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Release tag detected — snapshotting eval results..."
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          mkdir -p tests/evals/results/releases
          if [ -f tests/evals/results/latest.json ]; then
            cp tests/evals/results/latest.json "tests/evals/results/releases/${TAG_NAME}.json"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "tests/evals/results/releases/${TAG_NAME}.json"
            git commit -m "chore: snapshot eval results for ${TAG_NAME} [skip ci]"
            git push
          fi
      - name: Check for regressions
        if: success()
        run: |
          if [ -f tests/evals/results/latest.json ]; then
            python3 -c "
          import json, sys
          with open('tests/evals/results/latest.json') as f:
              results = json.load(f)
          per_skill = results.get('per_skill', {})
          regressions = []
          for skill_id, metrics in per_skill.items():
              judge_score = metrics.get('avg_judge_score')
              if judge_score is not None and judge_score < 0.5:
                  regressions.append((skill_id, judge_score))
          if regressions:
              print('✗ Skills with critically low judge scores (< 0.50):')
              for sid, score in sorted(regressions, key=lambda x: x[1]):
                  print(f'  {sid}: {score:.3f}')
              sys.exit(1)
          print(f'✓ No significant regressions detected ({len(per_skill)} skills checked)')
          "
          fi

  # ═══════════════════════════════════════════════════════════════════════════════
  # OPERATIONAL
  # ═══════════════════════════════════════════════════════════════════════════════

  performance-budget:
    name: "Ops: Performance budget"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Measure MCP cold-start time
        run: |
          START=$(date +%s%N)
          timeout 15 node run_mcp.js < /dev/null 2>&1 || true
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "Cold-start time: ${ELAPSED}ms"
          if [ "$ELAPSED" -gt 15000 ]; then
            echo "✗ Cold start exceeds 15s budget"
            exit 1
          fi
          echo "✓ Cold start within budget"

      - name: Measure skill routing time
        run: |
          python3 -c "
          import time, json
          with open('tests/.skills.json') as f:
              manifest = json.load(f)
          skills = manifest['skills']
          prompt = 'How do I create a DiskANN index for vector similarity search on Azure PostgreSQL?'
          start = time.perf_counter_ns()
          for _ in range(1000):
              for skill in skills:
                  for kw in skill.get('activation_keywords', []):
                      if kw.lower() in prompt.lower():
                          break
          elapsed_ms = (time.perf_counter_ns() - start) / 1_000_000
          avg_ms = elapsed_ms / 1000
          print(f'Routing time: {avg_ms:.3f}ms per query (1000 iterations)')
          if avg_ms > 100:
              print('✗ Routing exceeds 100ms budget')
              exit(1)
          print('✓ Routing within 100ms budget')
          "

  binary-integrity:
    name: "Ops: Binary SHA-256 integrity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify hash consistency across plugin copies
        run: |
          python3 -c "
          import json, sys
          from pathlib import Path

          # Load both run_mcp.js files and extract hashes
          files = list(Path('.').rglob('run_mcp.js'))
          print(f'Found {len(files)} run_mcp.js files')

          all_hashes = {}
          for f in files:
              content = f.read_text()
              import re
              hashes = dict(re.findall(r'\"(pgsql-tools-cli-[^\"]+)\":\s*\"([a-f0-9]{64})\"', content))
              all_hashes[str(f)] = hashes
              print(f'  {f}: {len(hashes)} hashes')

          # Verify all copies have same hashes
          hash_sets = list(all_hashes.values())
          for i in range(1, len(hash_sets)):
              if hash_sets[i] != hash_sets[0]:
                  print(f'✗ Hash mismatch between run_mcp.js copies')
                  sys.exit(1)

          # Verify all 5 platforms have hashes
          expected = ['linux-x64', 'linux-arm64', 'osx-arm64', 'osx-x86', 'win-x64']
          for platform in expected:
              found = any(platform in k for k in hash_sets[0].keys())
              if not found:
                  print(f'✗ Missing hash for platform: {platform}')
                  sys.exit(1)
              print(f'  ✓ {platform} hash present')

          print(f'✓ All binary hashes consistent and complete')
          "
