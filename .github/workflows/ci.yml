name: CI — Enterprise Test Suite

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_ROOT: ${{ github.workspace }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # TESTS — all Python tests run via a single pytest command
  # ═══════════════════════════════════════════════════════════════════════════════
  #
  # Covers content quality (manifests, structure, skill size, terminology, links,
  # activation precision, skill routing), security (secrets, licenses), MCP protocol
  # & skill routing, performance budget, binary integrity, and the
  # no-DB structural SQL fence lint. Database-backed lanes run in dedicated jobs:
  # `sql-validation` (marker: pg), `integration` (marker: integration), and
  # `azure-dogfood` (marker: azure, test_ai_app) which runs against a real Azure
  # server via PGSQL_TEST_CONNECTION_STRING.

  tests:
    name: "Tests: pytest suite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run pytest
        run: python -m pytest tests/ -v -m "not pg and not integration and not azure"
        timeout-minutes: 10

  # ═══════════════════════════════════════════════════════════════════════════════
  # COMPATIBILITY
  # ═══════════════════════════════════════════════════════════════════════════════

  cli-integration:
    name: "Compat: ${{ matrix.cli }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cli: copilot-cli
            os: ubuntu-latest
            install_cmd: npm install -g @github/copilot@latest
            add_marketplace_cmd: copilot plugin marketplace add "$(pwd)"
            add_plugin_cmd: copilot plugin install postgresql-agent-skills@postgresql-agent-skills

          - cli: claude-code
            os: ubuntu-latest
            install_cmd: npm install -g @anthropic-ai/claude-code@latest
            add_marketplace_cmd: claude plugin marketplace add "$(pwd)"
            add_plugin_cmd: claude plugin install postgresql-agent-skills@postgresql-agent-skills

          - cli: codex-cli
            os: ubuntu-latest
            install_cmd: npm install -g @openai/codex@latest
            add_marketplace_cmd: codex plugin marketplace add "$(pwd)"
            add_plugin_cmd: codex plugin add postgresql-agent-skills@postgresql-agent-skills

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ${{ matrix.cli }}
        run: ${{ matrix.install_cmd }}
        continue-on-error: false

      - name: Add marketplace (discover plugins)
        run: |
          set +e
          OUTPUT=$(${{ matrix.add_marketplace_cmd }} 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          if [ "$CODE" -ne 0 ]; then echo "✗ marketplace add exited $CODE"; exit 1; fi
          if echo "$OUTPUT" | grep -qi "error"; then echo "✗ marketplace add reported an error"; exit 1; fi
          echo "✓ marketplace added"

      - name: Install plugin
        run: |
          set +e
          OUTPUT=$(${{ matrix.add_plugin_cmd }} 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          if [ "$CODE" -ne 0 ]; then echo "✗ plugin install exited $CODE"; exit 1; fi
          if echo "$OUTPUT" | grep -qi "error"; then echo "✗ plugin install reported an error"; exit 1; fi
          echo "✓ plugin installed"

  cross-platform-binary:
    name: "Compat: Binary ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download and verify binary
        run: node plugin/run_mcp.js --version 2>&1 || true
        timeout-minutes: 3
      - name: Verify binary exists in cache
        shell: bash
        run: |
          CACHE_DIR="$HOME/.pgsql-tools-cli"
          if [ -d "$CACHE_DIR" ]; then
            echo "✓ Binary cache created at $CACHE_DIR"
            find "$CACHE_DIR" -type f | sed -n '1,10p'
          else
            echo "✗ Binary cache not found"
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════════════════════
  # DATABASE
  # ═══════════════════════════════════════════════════════════════════════════════

  sql-validation:
    name: "DB: SQL syntax (PG ${{ matrix.pg_version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version: ["14", "15", "16", "17"]
    env:
      PG_VERSION: ${{ matrix.pg_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Start PostgreSQL (pgvector) via Docker
        run: docker compose -f tests/docker-compose.yml up -d --wait

      - name: Validate SQL snippets
        run: python -m pytest tests/test_sql_syntax.py -v -m pg

      - name: Stop database
        if: always()
        run: docker compose -f tests/docker-compose.yml down -v

  integration:
    name: "DB: Integration (MCP e2e)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Start PostgreSQL (pgvector) via Docker
        run: docker compose -f tests/docker-compose.yml up -d --wait
      - name: Run integration tests
        run: python -m pytest tests/ -v -m integration
        timeout-minutes: 15
      - name: Stop database
        if: always()
        run: docker compose -f tests/docker-compose.yml down -v

  # ═══════════════════════════════════════════════════════════════════════════════
  # AZURE
  # ═══════════════════════════════════════════════════════════════════════════════

  azure-dogfood:
    name: "Dogfood: AI app (Azure)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run Azure dogfood test
        env:
          PGSQL_TEST_CONNECTION_STRING: ${{ secrets.PGSQL_TEST_CONNECTION_STRING }}
        run: python -m pytest tests/test_ai_app.py -v -m azure
        timeout-minutes: 15

  # ═══════════════════════════════════════════════════════════════════════════════
  # EVAL
  # ═══════════════════════════════════════════════════════════════════════════════

  eval-pipeline:
    name: "Eval delta tracking"
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install eval dependencies
        run: pip install -r tests/evals/requirements.txt
      - name: Run routing eval (no LLM)
        run: |
          cd tests/evals
          python routing_eval.py
      - name: Run eval pipeline
        env:
          PGSQL_TEST_CONNECTION_STRING: ${{ secrets.PGSQL_TEST_CONNECTION_STRING }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: |
          if [ -z "$PGSQL_TEST_CONNECTION_STRING" ] || [ -z "$AZURE_OPENAI_ENDPOINT" ] || [ -z "$AZURE_OPENAI_API_KEY" ]; then
            echo "⚠ Required secrets not set — skipping eval pipeline"
            exit 0
          fi
          cd tests/evals
          python pipeline.py --provider azure --output results/
      - name: Upload eval summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: tests/evals/results/latest.json
          retention-days: 30
      - name: Upload detailed eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-detailed-results
          path: |
            tests/evals/results/report_*.json
            tests/evals/results/results_*.json
          retention-days: 30
      - name: Commit eval results on release tags only
        if: success() && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Release tag detected — snapshotting eval results..."
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          mkdir -p tests/evals/results/releases
          if [ -f tests/evals/results/latest.json ]; then
            cp tests/evals/results/latest.json "tests/evals/results/releases/${TAG_NAME}.json"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "tests/evals/results/releases/${TAG_NAME}.json"
            git commit -m "chore: snapshot eval results for ${TAG_NAME} [skip ci]"
            git push
          fi
      - name: Check for regressions
        if: success()
        run: |
          cd tests/evals
          python eval_regression.py
